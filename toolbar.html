<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; background: #141416; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 11px;
    color: #7c7c82;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr auto;
    /* the chrome stays monochrome no matter what */
    filter: grayscale(1);
  }
  /* ---- top toolbar (also the title/drag bar) ---- */
  #bar {
    grid-row: 1; grid-column: 1 / 3;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1px 7px;
    padding: 2px 6px;
    /* keep clear of the native window control buttons (top-right) */
    padding-right: calc(100vw - env(titlebar-area-width, 100vw) + 6px);
    min-height: 30px;
    overflow: hidden;
    /* empty toolbar space acts as the title bar: draggable to move the window */
    -webkit-app-region: drag;
  }
  #bar button, #bar select, .chip { -webkit-app-region: no-drag; }
  button, select {
    font: inherit;
    line-height: 1.2;
    color: #7c7c82;
    background: #202024;
    border: 1px solid #2e2e33;
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
    flex: none;
  }
  select { padding: 1px 2px; }
  button:hover, select:hover { background: #2a2a2f; color: #9a9aa0; }
  button:active { background: #333338; }
  button.on { background: #3c3c44; border-color: #4c4c54; color: #b4b4ba; }
  .chip {
    position: relative;
    display: flex;
    align-items: center;
    gap: 3px;
    background: #202024;
    border: 1px solid #2e2e33;
    border-radius: 4px;
    padding: 2px 6px;
    cursor: ns-resize;
    flex: none;
  }
  .chip:hover { background: #2a2a2f; }
  .chip .k { color: #5e5e64; }
  .chip .v { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; color: #8e8e94; }
  .steps {
    position: absolute;
    right: 1px;
    top: 1px;
    bottom: 1px;
    display: none;
    flex-direction: column;
    justify-content: center;
  }
  .chip:hover .steps { display: flex; }
  .steps button {
    font-size: 7px;
    line-height: 1;
    padding: 1px 3px;
    border: none;
    border-radius: 2px;
    background: #3a3a40;
  }
  .steps button:hover { background: #4c4c54; color: #b4b4ba; }
  /* ---- Claude chat panel, attached to the right of the game ---- */
  #chatPanel {
    grid-row: 2; grid-column: 2;
    width: 280px;
    display: none;
    flex-direction: column;
    border-left: 1px solid #232327;
    background: #17171a;
  }
  #chatPanel.open { display: flex; }
  #pickup { border-bottom: 1px solid #232327; padding: 7px 8px 5px; flex: none; }
  #pickupHead { font-size: 11px; color: #77777e; margin-bottom: 4px; }
  #pickupNote { color: #55555c; font-size: 10px; }
  #pickupList { display: flex; flex-direction: column; }
  .pk {
    display: flex; align-items: center; gap: 7px;
    padding: 1px 2px; border-radius: 4px;
  }
  .pk.today { background: #222230; }
  .pk img { width: 30px; height: 30px; image-rendering: pixelated; flex: none; }
  .pk .d { width: 34px; color: #62626a; font-variant-numeric: tabular-nums; flex: none; }
  .pk .n { color: #9e9ea6; font-size: 12px; }
  .pk.today .n { color: #c0c0c8; }
  #msgs {
    flex: 1; overflow-y: auto;
    padding: 8px;
    font-size: 12.5px; line-height: 1.55;
    user-select: text;
  }
  .m { margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .m.user {
    color: #b8b8be; background: #202028;
    border-radius: 6px; padding: 5px 8px;
  }
  .m.ai { color: #9e9ea6; }
  .m.status { color: #62626a; font-style: italic; }
  .m.err { color: #8a6a6a; }
  #keyRow { display: none; padding: 8px; border-top: 1px solid #232327; }
  #keyRow.show { display: block; }
  #keyRow p { margin: 0 0 6px; font-size: 11px; color: #77777e; line-height: 1.5; }
  #keyRow input {
    width: 100%; font: inherit; color: #a8a8ae;
    background: #1c1c20; border: 1px solid #2e2e33; border-radius: 4px;
    padding: 4px 6px; outline: none; margin-bottom: 5px;
  }
  #inputRow { display: flex; padding: 8px; border-top: 1px solid #232327; }
  #chatInput {
    flex: 1; resize: none;
    font: inherit; font-size: 12.5px; line-height: 1.4;
    color: #a8a8ae; background: #1c1c20;
    border: 1px solid #2e2e33; border-radius: 5px;
    padding: 5px 7px; outline: none;
    height: 52px;
  }
  #chatInput:focus { border-color: #4c4c54; }
</style>
</head>
<body>
  <div id="bar">
    <select id="tone" title="화면 톤 (Ctrl+G: 컬러/톤 전환)">
      <option value="none">컬러</option>
      <option value="gray">흑백</option>
      <option value="sepia">세피아</option>
    </select>
    <span class="chip" id="chip-toneAmount" title="톤 강도 — 휠 또는 ▲▼로 조절">
      <span class="k">강</span><span class="v"></span><span class="steps"></span>
    </span>
    <span class="chip" id="chip-brightness" title="화면 밝기 (Ctrl+↑/↓) — 휠 또는 ▲▼로 조절">
      <span class="k">밝</span><span class="v"></span><span class="steps"></span>
    </span>
    <span class="chip" id="chip-opacity" title="창 투명도 (Ctrl+←/→) — 휠 또는 ▲▼로 조절">
      <span class="k">투</span><span class="v"></span><span class="steps"></span>
    </span>
    <button id="reload" title="게임 새로고침 (Ctrl+R)">⟳</button>
    <button id="web" title="브라우저 창 열기 — 게임은 계속 실행됩니다 (Ctrl+L)">🌐</button>
    <button id="chat" title="Claude 공략 도우미 패널">✳</button>
    <button id="mute" title="음소거 (Ctrl+M) — 창이 비활성화되면 자동 음소거"></button>
    <button id="preset" title="미니(우하단) ↔ 일반(중앙) 크기 전환 (Ctrl+P)">⇄</button>
    <button id="top" title="창을 항상 다른 창 위에 표시 (Ctrl+T)">📌</button>
    <button id="boss" title="창 숨기기 — 트레이 아이콘 클릭 또는 Ctrl+Alt+P로 복귀">숨김</button>
  </div>
  <div id="chatPanel">
    <div id="pickup">
      <div id="pickupHead">주간 전설 픽업 <span id="pickupNote">(00:00 UTC = 오전 9시 교체)</span></div>
      <div id="pickupList"></div>
    </div>
    <div id="msgs"></div>
    <div id="keyRow">
      <p>Claude API 키가 필요합니다. console.anthropic.com에서 발급한 키를 입력하거나,
      환경변수 ANTHROPIC_API_KEY를 설정하고 앱을 재시작하세요.</p>
      <input id="keyInput" type="password" placeholder="sk-ant-..." />
      <button id="keySave">키 저장</button>
    </div>
    <div id="inputRow">
      <textarea id="chatInput" placeholder="주력 포켓몬 기술배치 등 질문 — Enter 전송, Shift+Enter 줄바꿈"></textarea>
    </div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  let state = null;

  // value chips: mouse wheel or hover ▲▼ buttons adjust in 5% steps
  for (const key of ["toneAmount", "brightness", "opacity"]) {
    const chip = $("chip-" + key);
    const bump = d => state && window.mini.set({ [key]: state[key] + d });
    chip.addEventListener("wheel", e => {
      e.preventDefault();
      bump(e.deltaY < 0 ? 5 : -5);
    });
    const steps = chip.querySelector(".steps");
    for (const [glyph, d] of [["▲", 5], ["▼", -5]]) {
      const b = document.createElement("button");
      b.textContent = glyph;
      b.addEventListener("click", () => bump(d));
      steps.appendChild(b);
    }
  }

  $("reload").addEventListener("click", () => window.mini.reload());
  $("web").addEventListener("click", () => window.mini.openBrowser());
  $("boss").addEventListener("click", () => window.mini.boss());
  $("preset").addEventListener("click", () => window.mini.preset());
  $("top").addEventListener("click", () => state && window.mini.set({ alwaysOnTop: !state.alwaysOnTop }));
  $("mute").addEventListener("click", () => state && window.mini.set({ muted: !state.muted }));
  $("tone").addEventListener("change", e => {
    window.mini.set({ tone: e.target.value });
    window.mini.focusGame();
  });

  // Keyboard input belongs to the game: clicks on the toolbar hand focus
  // straight back (the chat panel is exempt), and Tab/Esc jump to the game.
  document.addEventListener("click", e => {
    if (e.target.id !== "tone" && !e.target.closest("#chatPanel")) {
      window.mini.focusGame();
    }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Tab" || e.key === "Escape") && !e.target.closest("#chatPanel")) {
      e.preventDefault();
      window.mini.focusGame();
    }
  });

  window.mini.onState(s => {
    state = s;
    $("tone").value = s.tone;
    $("chip-toneAmount").style.display = s.tone === "none" ? "none" : "flex";
    $("chip-toneAmount").querySelector(".v").textContent = s.toneAmount + "%";
    $("chip-brightness").querySelector(".v").textContent = s.brightness + "%";
    $("chip-opacity").querySelector(".v").textContent = s.opacity + "%";
    $("top").classList.toggle("on", s.alwaysOnTop);
    $("mute").classList.toggle("on", s.muted);
    $("mute").textContent = s.muted ? "🔇" : "🔊";
    // dim the chrome (toolbar + chat panel) together with the game
    document.body.style.filter = `grayscale(1) brightness(${s.brightness / 100})`;
  });

  // Report the toolbar's real height (wrapped rows) so the game view
  // can be laid out right below it.
  const bar = $("bar");
  const reportHeight = () => window.mini.height(Math.ceil(bar.offsetHeight));
  new ResizeObserver(reportHeight).observe(bar);
  window.addEventListener("resize", reportHeight);
  reportHeight();

  // ---- Claude chat panel ----
  const msgs = $("msgs");
  let chatOpen = false;
  let currentAi = null;
  let statusEl = null;

  let pickupLoadedDay = null;
  async function loadPickup() {
    const today = new Date().toDateString();
    if (pickupLoadedDay === today) {
      return;
    }
    try {
      const week = await window.mini.pickupWeek();
      const list = $("pickupList");
      list.textContent = "";
      for (const p of week) {
        const row = document.createElement("div");
        row.className = "pk" + (p.today ? " today" : "");
        row.title = `${p.ko} (${p.en})`;
        const img = document.createElement("img");
        img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
        img.alt = "";
        const d = document.createElement("span");
        d.className = "d";
        d.textContent = `${p.month}/${p.day}`;
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = p.ko + (p.today ? " ← 오늘" : "");
        row.append(img, d, n);
        list.appendChild(row);
      }
      pickupLoadedDay = today;
    } catch {
      /* pickup list is best-effort */
    }
  }

  $("chat").addEventListener("click", () => {
    chatOpen = !chatOpen;
    $("chatPanel").classList.toggle("open", chatOpen);
    $("chat").classList.toggle("on", chatOpen);
    window.mini.chatToggle(chatOpen);
    if (chatOpen) {
      loadPickup();
      $("chatInput").focus();
    }
  });

  function addMsg(cls, text) {
    const d = document.createElement("div");
    d.className = "m " + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  const input = $("chatInput");
  input.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || currentAi) {
        return;
      }
      addMsg("user", text);
      input.value = "";
      currentAi = addMsg("ai", "");
      window.mini.chatSend(text);
    }
  });

  window.mini.onChatStatus(t => {
    if (!statusEl) {
      statusEl = addMsg("status", t);
    } else {
      statusEl.textContent = t;
    }
    msgs.scrollTop = msgs.scrollHeight;
  });
  window.mini.onChatDelta(t => {
    if (statusEl) {
      statusEl.remove();
      statusEl = null;
    }
    if (currentAi) {
      currentAi.textContent += t;
      msgs.scrollTop = msgs.scrollHeight;
    }
  });
  window.mini.onChatDone(() => {
    if (statusEl) { statusEl.remove(); statusEl = null; }
    if (currentAi && !currentAi.textContent) {
      currentAi.remove();
    }
    currentAi = null;
  });
  window.mini.onChatError(m => {
    if (statusEl) { statusEl.remove(); statusEl = null; }
    if (currentAi && !currentAi.textContent) { currentAi.remove(); }
    currentAi = null;
    addMsg("err", "오류: " + m);
  });
  window.mini.onNeedKey(() => {
    if (currentAi && !currentAi.textContent) { currentAi.remove(); }
    currentAi = null;
    $("keyRow").classList.add("show");
  });
  $("keySave").addEventListener("click", () => {
    const k = $("keyInput").value.trim();
    if (k) {
      window.mini.setKey(k);
      $("keyInput").value = "";
      $("keyRow").classList.remove("show");
      addMsg("status", "키가 저장되었습니다. 다시 질문해보세요.");
    }
  });
</script>
</body>
</html>
