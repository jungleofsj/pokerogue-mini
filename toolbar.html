<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; background: #141416; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 11px;
    color: #7c7c82;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: auto 1fr;
    /* the chrome stays monochrome no matter what */
    filter: grayscale(1);
  }
  #chrome { grid-row: 1; grid-column: 1 / 3; }
  /* ---- top toolbar (also the title/drag bar) ---- */
  #bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1px 7px;
    padding: 2px 6px;
    /* keep clear of the native window control buttons (top-right) */
    padding-right: calc(100vw - env(titlebar-area-width, 100vw) + 6px);
    min-height: 30px;
    overflow: hidden;
    /* empty toolbar space acts as the title bar: draggable to move the window */
    -webkit-app-region: drag;
  }
  #bar button, #bar select, .chip { -webkit-app-region: no-drag; }
  button, select {
    font: inherit;
    line-height: 1.2;
    color: #7c7c82;
    background: #202024;
    border: 1px solid #2e2e33;
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
    flex: none;
  }
  select { padding: 1px 2px; }
  button:hover, select:hover { background: #2a2a2f; color: #9a9aa0; }
  button:active { background: #333338; }
  button.on { background: #3c3c44; border-color: #4c4c54; color: #b4b4ba; }
  .chip {
    position: relative;
    display: flex;
    align-items: center;
    gap: 3px;
    background: #202024;
    border: 1px solid #2e2e33;
    border-radius: 4px;
    padding: 2px 6px;
    cursor: ns-resize;
    flex: none;
  }
  .chip:hover { background: #2a2a2f; }
  .chip .k { color: #5e5e64; }
  .chip .v { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; color: #8e8e94; }
  .steps {
    position: absolute;
    right: 1px;
    top: 1px;
    bottom: 1px;
    display: none;
    flex-direction: column;
    justify-content: center;
  }
  .chip:hover .steps { display: flex; }
  .steps button {
    font-size: 7px;
    line-height: 1;
    padding: 1px 3px;
    border: none;
    border-radius: 2px;
    background: #3a3a40;
  }
  .steps button:hover { background: #4c4c54; color: #b4b4ba; }
  /* ---- tab strip ---- */
  #tabs {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 2px 6px 0;
    height: 24px;
    overflow: hidden;
  }
  .tab {
    display: flex; align-items: center; gap: 4px;
    max-width: 140px; min-width: 40px;
    padding: 3px 6px 3px 8px;
    font-size: 10.5px;
    background: #1c1c20;
    border: 1px solid #2a2a2f; border-bottom: none;
    border-radius: 6px 6px 0 0;
    color: #6a6a71;
    cursor: pointer;
    flex: 0 1 auto;
    overflow: hidden;
  }
  .tab.active { background: #232329; color: #a0a0a8; }
  .tab .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .x {
    flex: none; width: 13px; height: 13px; line-height: 11px;
    text-align: center; border-radius: 3px; font-size: 11px; color: #55555c;
  }
  .tab .x:hover { background: #3a3a42; color: #b4b4ba; }
  #newTab {
    flex: none; width: 20px; height: 18px; margin-bottom: 1px;
    border: none; border-radius: 4px;
    background: transparent; color: #55555c;
    font-size: 12px; cursor: pointer; padding: 0;
  }
  #newTab:hover { background: #26262c; color: #9a9aa0; }
  /* ---- address row (web tabs only) ---- */
  #addrRow {
    display: none;
    align-items: center; gap: 4px;
    padding: 3px 6px;
    background: #232329;
  }
  #addrRow.show { display: flex; }
  #addrRow button { padding: 1px 6px; }
  #addr {
    flex: 1; min-width: 40px;
    font: inherit; font-size: 10.5px; color: #8e8e94;
    background: #1a1a1e; border: 1px solid #2e2e33; border-radius: 4px;
    padding: 2px 7px; outline: none;
  }
  #addr:focus { border-color: #4c4c54; color: #a8a8ae; }
  /* ---- Claude panel, attached to the LEFT of the content ---- */
  #chatPanel {
    grid-row: 2; grid-column: 1;
    width: 240px;
    display: none;
    flex-direction: column;
    border-right: 1px solid #232327;
    background: #17171a;
    position: relative;
  }
  #chatPanel.open { display: flex; }
  /* drag handle on the panel's right edge (panel <-> game size) */
  #resizer {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 6px;
    cursor: ew-resize;
    z-index: 5;
  }
  #resizer:hover, #resizer.drag { background: #33333c; }
  /* ultra-compact pickup list: date+icon only, names in the tooltip */
  #pickup { border-bottom: 1px solid #232327; padding: 2px 4px; flex: none; }
  #pickupList { display: flex; flex-direction: column; }
  .pk {
    display: flex; align-items: center; gap: 2px;
    height: 17px;
    padding: 0 2px; border-radius: 3px;
    width: fit-content;
  }
  .pk.today { background: #242430; }
  .pk img { width: 16px; height: 16px; image-rendering: pixelated; flex: none; }
  .pk .d { width: 23px; font-size: 8.5px; color: #5c5c63; font-variant-numeric: tabular-nums; flex: none; }
  .pk.today .d { color: #9a9ab0; }
  #msgs {
    flex: 1; overflow-y: auto;
    padding: 7px;
    font-size: 11px; line-height: 1.5;
    user-select: text;
  }
  .m { margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
  .m.user {
    color: #b0b0b6; background: #202028;
    border-radius: 5px; padding: 4px 7px;
  }
  .m.ai { color: #96969e; }
  .m.status { color: #5c5c63; font-style: italic; }
  .m.err { color: #8a6a6a; }
  #keyRow { display: none; padding: 7px; border-top: 1px solid #232327; }
  #keyRow.show { display: block; }
  #keyRow p { margin: 0 0 5px; font-size: 10px; color: #6e6e75; line-height: 1.5; }
  #keyRow input {
    width: 100%; font: inherit; color: #a8a8ae;
    background: #1c1c20; border: 1px solid #2e2e33; border-radius: 4px;
    padding: 3px 6px; outline: none; margin-bottom: 4px;
  }
  #inputRow { display: flex; padding: 6px; border-top: 1px solid #232327; }
  #chatInput {
    flex: 1; resize: none;
    font: inherit; font-size: 11px; line-height: 1.4;
    color: #a8a8ae; background: #1c1c20;
    border: 1px solid #2e2e33; border-radius: 5px;
    padding: 4px 6px; outline: none;
    height: 44px;
  }
  #chatInput:focus { border-color: #4c4c54; }
</style>
</head>
<body>
  <div id="chrome">
    <div id="bar">
      <select id="tone" title="화면 톤 (Ctrl+G: 컬러/톤 전환)">
        <option value="none">컬러</option>
        <option value="gray">흑백</option>
        <option value="sepia">세피아</option>
      </select>
      <span class="chip" id="chip-toneAmount" title="톤 강도 — 휠 또는 ▲▼로 조절">
        <span class="k">강</span><span class="v"></span><span class="steps"></span>
      </span>
      <span class="chip" id="chip-brightness" title="화면 밝기 (Ctrl+↑/↓) — 휠 또는 ▲▼로 조절">
        <span class="k">밝</span><span class="v"></span><span class="steps"></span>
      </span>
      <span class="chip" id="chip-opacity" title="창 투명도 (Ctrl+←/→) — 휠 또는 ▲▼로 조절">
        <span class="k">투</span><span class="v"></span><span class="steps"></span>
      </span>
      <button id="reload" title="현재 탭 새로고침 (Ctrl+R)">⟳</button>
      <button id="chat" title="Claude 공략 도우미 + 주간 픽업 패널">✳</button>
      <button id="mute" title="음소거 (Ctrl+M) — 창이 비활성화되면 자동 음소거"></button>
      <button id="preset" title="미니(우하단) ↔ 일반(중앙) 크기 전환 (Ctrl+P)">⇄</button>
      <button id="top" title="창을 항상 다른 창 위에 표시 (Ctrl+Shift+T)">📌</button>
      <button id="boss" title="창 숨기기 — 트레이 아이콘 클릭 또는 Ctrl+Alt+P로 복귀">숨김</button>
    </div>
    <div id="tabs">
      <button id="newTab" title="새 웹 탭 (Ctrl+T)">＋</button>
    </div>
    <div id="addrRow">
      <button id="back" title="뒤로">◀</button>
      <button id="fwd" title="앞으로">▶</button>
      <input id="addr" type="text" spellcheck="false" placeholder="주소 또는 검색어 (Ctrl+L) — Ctrl+휠: 좌우 스크롤" />
    </div>
  </div>
  <div id="chatPanel">
    <div id="pickup" title="주간 전설 픽업 (오전 9시 교체)">
      <div id="pickupList"></div>
    </div>
    <div id="msgs"></div>
    <div id="keyRow">
      <p>Claude API 키가 필요합니다. console.anthropic.com에서 발급한 키를 입력하거나,
      환경변수 ANTHROPIC_API_KEY를 설정하고 앱을 재시작하세요.</p>
      <input id="keyInput" type="password" placeholder="sk-ant-..." />
      <button id="keySave">키 저장</button>
    </div>
    <div id="inputRow">
      <textarea id="chatInput" placeholder="질문 — Enter 전송, Shift+Enter 줄바꿈"></textarea>
    </div>
    <div id="resizer" title="드래그로 패널 폭 조절"></div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  let state = null;

  // value chips: mouse wheel or hover ▲▼ buttons adjust in 5% steps
  for (const key of ["toneAmount", "brightness", "opacity"]) {
    const chip = $("chip-" + key);
    const bump = d => state && window.mini.set({ [key]: state[key] + d });
    chip.addEventListener("wheel", e => {
      e.preventDefault();
      bump(e.deltaY < 0 ? 5 : -5);
    });
    const steps = chip.querySelector(".steps");
    for (const [glyph, d] of [["▲", 5], ["▼", -5]]) {
      const b = document.createElement("button");
      b.textContent = glyph;
      b.addEventListener("click", () => bump(d));
      steps.appendChild(b);
    }
  }

  $("reload").addEventListener("click", () => window.mini.reload());
  $("boss").addEventListener("click", () => window.mini.boss());
  $("preset").addEventListener("click", () => window.mini.preset());
  $("top").addEventListener("click", () => state && window.mini.set({ alwaysOnTop: !state.alwaysOnTop }));
  $("mute").addEventListener("click", () => state && window.mini.set({ muted: !state.muted }));
  $("tone").addEventListener("change", e => {
    window.mini.set({ tone: e.target.value });
    window.mini.focusGame();
  });

  // Keyboard input belongs to the active tab: clicks on the chrome hand focus
  // straight back (chat panel and address bar are exempt).
  document.addEventListener("click", e => {
    if (e.target.id !== "tone" && !e.target.closest("#chatPanel") && !e.target.closest("#addrRow")) {
      window.mini.focusGame();
    }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Tab" || e.key === "Escape") && !e.target.closest("#chatPanel") && !e.target.closest("#addrRow")) {
      e.preventDefault();
      window.mini.focusGame();
    }
  });

  window.mini.onState(s => {
    state = s;
    $("tone").value = s.tone;
    $("chip-toneAmount").style.display = s.tone === "none" ? "none" : "flex";
    $("chip-toneAmount").querySelector(".v").textContent = s.toneAmount + "%";
    $("chip-brightness").querySelector(".v").textContent = s.brightness + "%";
    $("chip-opacity").querySelector(".v").textContent = s.opacity + "%";
    $("top").classList.toggle("on", s.alwaysOnTop);
    $("mute").classList.toggle("on", s.muted);
    $("mute").textContent = s.muted ? "🔇" : "🔊";
    if (!resizing) {
      $("chatPanel").style.width = s.chatPanelWidth + "px";
    }
    // dim the chrome (toolbar + panel) together with the game
    document.body.style.filter = `grayscale(1) brightness(${s.brightness / 100})`;
  });

  // ---- tabs ----
  const tabsEl = $("tabs");
  const newTabBtn = $("newTab");
  newTabBtn.addEventListener("click", () => window.mini.tabNew());

  window.mini.onTabs(tabs => {
    for (const el of tabsEl.querySelectorAll(".tab")) {
      el.remove();
    }
    let webActive = false;
    for (const t of tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.active ? " active" : "");
      el.title = t.title;
      const title = document.createElement("span");
      title.className = "t";
      title.textContent = t.title;
      el.appendChild(title);
      if (t.id !== "game") {
        const x = document.createElement("span");
        x.className = "x";
        x.textContent = "×";
        x.title = "탭 닫기 (Ctrl+W)";
        x.addEventListener("click", e => {
          e.stopPropagation();
          window.mini.tabClose(t.id);
        });
        el.appendChild(x);
        el.addEventListener("auxclick", e => {
          if (e.button === 1) {
            window.mini.tabClose(t.id);
          }
        });
        if (t.active) {
          webActive = true;
        }
      }
      el.addEventListener("click", () => window.mini.tabActivate(t.id));
      tabsEl.insertBefore(el, newTabBtn);
    }
    $("addrRow").classList.toggle("show", webActive);
  });

  const addr = $("addr");
  $("back").addEventListener("click", () => window.mini.nav("back"));
  $("fwd").addEventListener("click", () => window.mini.nav("forward"));
  addr.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter" && addr.value.trim()) {
      window.mini.navigate(addr.value.trim());
      window.mini.focusGame();
    } else if (e.key === "Escape") {
      window.mini.focusGame();
    }
  });
  addr.addEventListener("focus", () => addr.select());
  window.mini.onUrl(u => {
    if (document.activeElement !== addr) {
      addr.value = u;
    }
  });
  window.mini.onFocusAddress(() => addr.focus());

  // Report the chrome's real height (toolbar + tabs + address row) so the
  // content views can be laid out right below it.
  const chrome = $("chrome");
  const reportHeight = () => window.mini.height(Math.ceil(chrome.offsetHeight));
  new ResizeObserver(reportHeight).observe(chrome);
  window.addEventListener("resize", reportHeight);
  reportHeight();

  // ---- panel <-> game resizer ----
  let resizing = false;
  let panelW = 240;
  const resizer = $("resizer");
  resizer.addEventListener("pointerdown", e => {
    resizing = true;
    panelW = (state && state.chatPanelWidth) || 240;
    resizer.classList.add("drag");
    resizer.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  document.addEventListener("pointermove", e => {
    if (!resizing) {
      return;
    }
    if (e.buttons === 0) {
      endResize();
      return;
    }
    panelW = Math.min(480, Math.max(160, Math.round(e.clientX)));
    $("chatPanel").style.width = panelW + "px";
    window.mini.panelWidth(panelW);
  });
  function endResize() {
    if (resizing) {
      resizing = false;
      resizer.classList.remove("drag");
      window.mini.set({ chatPanelWidth: panelW });
    }
  }
  document.addEventListener("pointerup", endResize);

  // ---- pickup list (compact vertical rows) ----
  let pickupLoadedDay = null;
  async function loadPickup() {
    const today = new Date().toDateString();
    if (pickupLoadedDay === today) {
      return;
    }
    try {
      const week = await window.mini.pickupWeek();
      const list = $("pickupList");
      list.textContent = "";
      for (const p of week) {
        const cell = document.createElement("div");
        cell.className = "pk" + (p.today ? " today" : "");
        cell.title = `${p.month}/${p.day} ${p.ko} (${p.en})${p.today ? " — 오늘" : ""}`;
        const d = document.createElement("span");
        d.className = "d";
        d.textContent = `${p.month}/${p.day}`;
        const img = document.createElement("img");
        img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
        img.alt = p.ko;
        cell.append(d, img);
        list.appendChild(cell);
      }
      pickupLoadedDay = today;
    } catch {
      /* pickup list is best-effort */
    }
  }

  // ---- Claude chat panel ----
  const msgs = $("msgs");
  let chatOpen = false;
  let currentAi = null;
  let statusEl = null;

  $("chat").addEventListener("click", () => {
    chatOpen = !chatOpen;
    $("chatPanel").classList.toggle("open", chatOpen);
    $("chat").classList.toggle("on", chatOpen);
    window.mini.chatToggle(chatOpen);
    if (chatOpen) {
      loadPickup();
      $("chatInput").focus();
    }
  });

  function addMsg(cls, text) {
    const d = document.createElement("div");
    d.className = "m " + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  const input = $("chatInput");
  input.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || currentAi) {
        return;
      }
      addMsg("user", text);
      input.value = "";
      currentAi = addMsg("ai", "");
      window.mini.chatSend(text);
    }
  });

  window.mini.onChatStatus(t => {
    if (!statusEl) {
      statusEl = addMsg("status", t);
    } else {
      statusEl.textContent = t;
    }
    msgs.scrollTop = msgs.scrollHeight;
  });
  window.mini.onChatDelta(t => {
    if (statusEl) {
      statusEl.remove();
      statusEl = null;
    }
    if (currentAi) {
      currentAi.textContent += t;
      msgs.scrollTop = msgs.scrollHeight;
    }
  });
  window.mini.onChatDone(() => {
    if (statusEl) { statusEl.remove(); statusEl = null; }
    if (currentAi && !currentAi.textContent) {
      currentAi.remove();
    }
    currentAi = null;
  });
  window.mini.onChatError(m => {
    if (statusEl) { statusEl.remove(); statusEl = null; }
    if (currentAi && !currentAi.textContent) { currentAi.remove(); }
    currentAi = null;
    addMsg("err", "오류: " + m);
  });
  window.mini.onNeedKey(() => {
    if (currentAi && !currentAi.textContent) { currentAi.remove(); }
    currentAi = null;
    $("keyRow").classList.add("show");
  });
  $("keySave").addEventListener("click", () => {
    const k = $("keyInput").value.trim();
    if (k) {
      window.mini.setKey(k);
      $("keyInput").value = "";
      $("keyRow").classList.remove("show");
      addMsg("status", "키가 저장되었습니다. 다시 질문해보세요.");
    }
  });
</script>
</body>
</html>
