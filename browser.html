<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #141416; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 12px;
    color: #a8a8ae;
    display: flex;
    flex-direction: column;
    filter: grayscale(1);
    user-select: none;
  }
  /* ---- Chrome-style tab bar (also the drag/title area) ---- */
  #tabbar {
    height: 30px;
    display: flex; align-items: flex-end; gap: 2px;
    padding: 4px 6px 0;
    padding-right: calc(100vw - env(titlebar-area-width, 100vw) + 6px);
    -webkit-app-region: drag;
    overflow: hidden;
  }
  .tab {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; gap: 5px;
    max-width: 180px; min-width: 60px;
    padding: 4px 6px 4px 10px;
    background: #1c1c20;
    border: 1px solid #2a2a2f; border-bottom: none;
    border-radius: 7px 7px 0 0;
    color: #77777e;
    cursor: pointer;
    flex: 0 1 auto;
    overflow: hidden;
  }
  .tab.active { background: #232329; color: #a8a8ae; }
  .tab .t {
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab .x {
    flex: none;
    width: 15px; height: 15px; line-height: 13px;
    text-align: center; border-radius: 3px;
    font-size: 12px; color: #62626a;
  }
  .tab .x:hover { background: #3a3a42; color: #b4b4ba; }
  #newTab {
    -webkit-app-region: no-drag;
    flex: none;
    width: 24px; height: 22px;
    margin-bottom: 2px;
    border: none; border-radius: 5px;
    background: transparent; color: #62626a;
    font-size: 14px; cursor: pointer;
  }
  #newTab:hover { background: #26262c; color: #9a9aa0; }
  /* ---- address bar ---- */
  #addrbar {
    height: 34px;
    display: flex; align-items: center; gap: 5px;
    padding: 0 6px;
    background: #232329;
  }
  #addrbar button {
    font: inherit; line-height: 1.2;
    color: #7c7c82; background: #202024;
    border: 1px solid #2e2e33; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; flex: none;
  }
  #addrbar button:hover { background: #2a2a2f; color: #9a9aa0; }
  #addr {
    flex: 1; min-width: 60px;
    font: inherit; color: #8e8e94;
    background: #1a1a1e; border: 1px solid #2e2e33; border-radius: 4px;
    padding: 3px 8px; outline: none;
  }
  #addr:focus { border-color: #4c4c54; color: #a8a8ae; }
  #viewArea { flex: 1; }
</style>
</head>
<body>
  <div id="tabbar">
    <button id="newTab" title="새 탭 (Ctrl+T)">＋</button>
  </div>
  <div id="addrbar">
    <button id="back" title="뒤로">◀</button>
    <button id="fwd" title="앞으로">▶</button>
    <button id="reload" title="새로고침 (Ctrl+R)">⟳</button>
    <input id="addr" type="text" spellcheck="false" placeholder="주소 또는 검색어 (Ctrl+L) — Ctrl+휠: 좌우 스크롤" />
  </div>
  <div id="viewArea"></div>
<script>
  const $ = id => document.getElementById(id);
  const tabbar = $("tabbar");
  const newTabBtn = $("newTab");

  $("back").addEventListener("click", () => window.mb.nav("back"));
  $("fwd").addEventListener("click", () => window.mb.nav("forward"));
  $("reload").addEventListener("click", () => window.mb.reload());
  newTabBtn.addEventListener("click", () => window.mb.tabNew());

  const addr = $("addr");
  addr.addEventListener("keydown", e => {
    if (e.key === "Enter" && addr.value.trim()) {
      window.mb.navigate(addr.value.trim());
      window.mb.focusView();
    } else if (e.key === "Escape") {
      window.mb.focusView();
    }
  });
  addr.addEventListener("focus", () => addr.select());
  window.mb.onUrl(u => {
    if (document.activeElement !== addr) {
      addr.value = u;
    }
  });
  window.mb.onFocusAddress(() => addr.focus());

  window.mb.onTabs(tabs => {
    for (const el of tabbar.querySelectorAll(".tab")) {
      el.remove();
    }
    for (const t of tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.active ? " active" : "");
      el.title = t.title;
      const title = document.createElement("span");
      title.className = "t";
      title.textContent = t.title;
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "×";
      x.title = "탭 닫기 (Ctrl+W)";
      x.addEventListener("click", e => {
        e.stopPropagation();
        window.mb.tabClose(t.id);
      });
      el.addEventListener("click", () => window.mb.tabActivate(t.id));
      el.addEventListener("auxclick", e => {
        if (e.button === 1) {
          window.mb.tabClose(t.id);
        }
      });
      el.append(title, x);
      tabbar.insertBefore(el, newTabBtn);
    }
  });
</script>
</body>
</html>
